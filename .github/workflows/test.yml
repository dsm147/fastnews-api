name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: news_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -u root -p123456 news_app < 02-数据库sql文件/database.sql

      - name: 运行测试
        env:
          DATABASE_URL: mysql+aiomysql://root:123456@127.0.0.1:3306/news_app
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          pytest backend/tests/ -v --tb=short
